<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>딜 광장 | 모딜</title>
<link rel="stylesheet" href="mobile.css">
<style>
* { box-sizing: border-box; }
body { background: var(--bg); min-height: 100vh; padding-bottom: 80px; }

/* 헤더 */
.plz-header {
  background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
  padding: 16px 16px 14px; display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 100;
}
.plz-back {
  background: rgba(255,255,255,0.22); border: none; border-radius: 50%;
  width: 36px; height: 36px; font-size: 18px; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.plz-title { font-size: 17px; font-weight: 900; color: #fff; }
.plz-subtitle { font-size: 11.5px; color: rgba(255,255,255,0.8); margin-top: 2px; }

/* 정렬 탭 */
.plz-tabs { display: flex; gap: 8px; padding: 12px 14px 4px; }
.plz-tab {
  padding: 7px 16px; border-radius: 100px; border: 1.5px solid var(--coral-soft);
  background: var(--paper); font-size: 12px; font-weight: 700; color: var(--coral-dark); cursor: pointer;
}
.plz-tab.active { background: var(--coral); color: #fff; border-color: var(--coral); }

/* 카드 목록 */
.plz-list { padding: 10px 14px 0; display: flex; flex-direction: column; gap: 10px; }

/* 카드 */
.plz-card {
  background: var(--paper);
  border-radius: 16px;
  padding: 14px 14px 12px;
  box-shadow: 0 2px 10px rgba(45,20,16,0.07);
  border: 1.5px solid var(--line);
}
.plz-card.pinned { border-color: var(--coral-soft); background: #fff8f6; border-left: 4px solid var(--coral); }
.plz-card-head { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.plz-ava {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--coral-bg); display: flex; align-items: center; justify-content: center;
  font-size: 19px; flex-shrink: 0;
}
.plz-nick { font-size: 13px; font-weight: 800; color: var(--ink); }
.plz-lvl { font-size: 10px; color: var(--ink3); margin-left: 5px; font-weight: 600; }
.plz-pin-badge {
  margin-left: auto; font-size: 10px; font-weight: 800;
  color: var(--coral-dark); background: var(--coral-bg);
  padding: 3px 8px; border-radius: 100px;
}
.plz-time { margin-left: auto; font-size: 10.5px; color: var(--ink3); }
.plz-cat {
  display: inline-block; font-size: 10.5px; font-weight: 800;
  color: var(--coral-dark); background: var(--coral-bg);
  padding: 3px 9px; border-radius: 100px; margin-bottom: 7px;
}
.plz-body-txt {
  font-size: 14px; font-weight: 700; color: var(--ink);
  line-height: 1.5; margin-bottom: 11px;
}
.plz-body-txt b { color: var(--coral-dark); font-weight: 900; }
.plz-foot {
  display: flex; gap: 6px; align-items: center;
  padding-top: 9px; border-top: 1px solid var(--line);
}
.plz-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 13px; border-radius: 100px; border: 1.5px solid var(--line2);
  background: var(--bg); font-size: 12px; font-weight: 700; color: var(--ink2); cursor: pointer;
}
.plz-btn.like { background: #fff5f3; border-color: #ffd0c8; color: #c0392b; }
.plz-btn.like.on { background: var(--coral); border-color: var(--coral); color: #fff; }
.plz-btn.comment { background: #f0f4ff; border-color: #c5d0f7; color: #2c3e8c; }
.plz-btn.share { margin-left: auto; background: #e8f5e9; border-color: #a5d6a7; color: #2e7d32; }
.plz-mine { font-size: 10px; background: var(--coral); color: #fff; padding: 2px 7px; border-radius: 100px; margin-left: 4px; }

/* 빈 상태 */
.plz-empty { text-align: center; padding: 60px 20px; color: var(--ink2); font-size: 14px; }

/* 딜 쓰기 버튼 */
.plz-write-btn {
  position: fixed; bottom: 20px; right: 18px; z-index: 200;
  background: var(--coral); color: #fff; border: none; border-radius: 50px;
  padding: 13px 22px; font-size: 14px; font-weight: 800; cursor: pointer;
  box-shadow: 0 4px 16px rgba(255,99,71,0.38);
}
</style>
</head>
<body>

<div class="plz-header">
  <button class="plz-back" onclick="history.back()">←</button>
  <div style="flex:1">
    <div class="plz-title">🔥 실시간 딜 광장</div>
    <div class="plz-subtitle" id="plzCount"></div>
  </div>
</div>

<div class="plz-tabs">
  <button class="plz-tab active" id="sortLikes" onclick="setSort('likes')">🔥 인기순</button>
  <button class="plz-tab" id="sortNew" onclick="setSort('new')">🆕 최신순</button>
</div>

<!-- 정적 피드 목록 -->
<div class="plz-list" id="plzList"></div>

<button class="plz-write-btn" onclick="location.href='index.html'">✍️ 딜 요청하기</button>

<script src="data.js"></script>
<script>
var PLZ_KEY = 'modilMobilePlaza_v1';
var USER_KEY = 'modilUser_v1';
var sortMode = 'likes';

function loadPlzData() {
  try {
    var s = localStorage.getItem(PLZ_KEY);
    if (s) {
      var d = JSON.parse(s);
      var cutoff = Date.now() - 30 * 86400000;
      d.posts = (d.posts || []).filter(function(p) { return !p.ts || p.ts > cutoff; });
      localStorage.setItem(PLZ_KEY, JSON.stringify(d));
      return d;
    }
  } catch(e) {}
  return { posts: [] };
}
function savePlzData(data) { try { localStorage.setItem(PLZ_KEY, JSON.stringify(data)); } catch(e) {} }
function currentUser() { try { var s = localStorage.getItem(USER_KEY); return s ? JSON.parse(s) : null; } catch(e) { return null; } }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function num(n) { return Number(n||0).toLocaleString(); }
function agoText(ts) {
  if (!ts) return '';
  var m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return '방금 전';
  if (m < 60) return m + '분 전';
  if (m < 1440) return Math.floor(m/60) + '시간 전';
  return Math.floor(m/1440) + '일 전';
}
function isMyPost(p) { var u = currentUser(); return u && u.name === p.nick; }

function safeTitle(t) {
  return String(t||'').replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>');
}

function cardHTML(p) {
  var mine = isMyPost(p);
  var title = safeTitle(p.title);
  var timeStr = p.ts ? agoText(p.ts) : (p.ago ? Math.floor(p.ago/60)+'시간 전' : '');
  return '<div class="plz-card' + (p.pinned?' pinned':'') + '" id="plzfc-'+p.id+'">' +
    '<div class="plz-card-head">' +
      '<div class="plz-ava">' + (p.ava||'🙂') + '</div>' +
      '<div>' +
        '<span class="plz-nick">' + esc(p.nick) + '</span>' +
        '<span class="plz-lvl">' + esc(p.lvl||'LV.1') + '</span>' +
        (mine ? '<span class="plz-mine">내 글</span>' : '') +
      '</div>' +
      (p.pinned ? '<span class="plz-pin-badge">📌 고정</span>' : '<span class="plz-time">' + timeStr + '</span>') +
    '</div>' +
    '<div class="plz-cat">#' + esc(p.cat) + '</div>' +
    '<div class="plz-body-txt" id="plzfct-'+p.id+'">' + title + '</div>' +
    '<div class="plz-foot">' +
      '<button class="plz-btn like'+(p.liked?' on':'')+'" onclick="doLike(\''+p.id+'\')">👍 '+num(p.likes||0)+'</button>' +
      '<button class="plz-btn comment" onclick="doComment(\''+p.id+'\')">💬 '+num(p.comments||0)+'</button>' +
      '<button class="plz-btn share" onclick="doShare(\''+p.id+'\',\''+esc(p.title)+'\')">📤 추천</button>' +
      (mine ? '<button class="plz-btn" style="padding:6px 10px" onclick="doEdit(\''+p.id+'\')">✏️</button>' +
              '<button class="plz-btn" style="padding:6px 10px;background:#fce4ec;border-color:#f48fb1;color:#c62828" onclick="doDel(\''+p.id+'\')">🗑️</button>' : '') +
    '</div>' +
  '</div>';
}

function render() {
  var data = loadPlzData();
  var posts = data.posts.slice();

  if (sortMode === 'likes') {
    var pinned = posts.filter(function(p){ return p.pinned; }).sort(function(a,b){ return (b.likes||0)-(a.likes||0); });
    var rest   = posts.filter(function(p){ return !p.pinned; }).sort(function(a,b){ return (b.likes||0)-(a.likes||0); });
    posts = pinned.concat(rest);
  } else {
    var pinned = posts.filter(function(p){ return p.pinned; }).sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
    var rest   = posts.filter(function(p){ return !p.pinned; }).sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
    posts = pinned.concat(rest);
  }

  var cnt = document.getElementById('plzCount');
  if (cnt) cnt.textContent = '총 ' + posts.length + '개의 딜 요청';

  var list = document.getElementById('plzList');
  if (!posts.length) {
    list.innerHTML = '<div class="plz-empty">아직 딜 요청이 없어요.<br>첫 딜을 요청해보세요! 🐴</div>';
    return;
  }
  list.innerHTML = posts.map(cardHTML).join('');
}

function setSort(mode) {
  sortMode = mode;
  document.getElementById('sortLikes').classList.toggle('active', mode==='likes');
  document.getElementById('sortNew').classList.toggle('active', mode==='new');
  render();
}

function findPost(id) { var d = loadPlzData(); return { data: d, post: d.posts.find(function(p){return p.id===id;}) }; }

function doLike(id) {
  var r = findPost(id); if (!r.post) return;
  r.post.liked = !r.post.liked; r.post.likes = (r.post.likes||0)+(r.post.liked?1:-1);
  savePlzData(r.data); render();
}

function doComment(id) {
  var card = document.getElementById('plzfc-' + id); if (!card) return;
  var existing = document.getElementById('plzcmt-' + id);
  if (existing) { existing.remove(); return; }
  var box = document.createElement('div');
  box.id = 'plzcmt-' + id;
  box.style.cssText = 'margin-top:10px;display:flex;gap:6px;align-items:center';
  box.innerHTML = '<input id="plzcmtin-'+id+'" placeholder="댓글을 입력하세요…" style="flex:1;border:1.5px solid var(--coral-soft);border-radius:100px;padding:8px 13px;font-size:12px;outline:none">' +
    '<button onclick="submitComment(\''+id+'\')" style="background:var(--coral);color:#fff;border:none;border-radius:100px;padding:8px 15px;font-size:12px;font-weight:800;cursor:pointer">등록</button>';
  card.appendChild(box);
  document.getElementById('plzcmtin-'+id).focus();
}

function submitComment(id) {
  var inp = document.getElementById('plzcmtin-'+id);
  if (!inp || !inp.value.trim()) return;
  var r = findPost(id); if (!r.post) return;
  r.post.comments = (r.post.comments||0) + 1;
  savePlzData(r.data); render();
}

function doShare(id, title) {
  var url = 'https://visualmakerofficial-sejung.github.io/homme/#post-' + id;
  if (navigator.share) { navigator.share({ title: '모딜 딜 공유', text: title, url: url }); }
  else { navigator.clipboard.writeText(url).then(function(){ alert('링크 복사됨! 📋'); }); }
}

function doEdit(id) {
  var r = findPost(id); if (!r.post || !isMyPost(r.post)) return;
  var el = document.getElementById('plzfct-'+id); if (!el) return;
  var cur = r.post.title;
  el.innerHTML = '<textarea id="plzedit-'+id+'" style="width:100%;border:1.5px solid var(--coral);border-radius:10px;padding:9px;font-size:13px;font-family:inherit;resize:none;line-height:1.5;box-sizing:border-box" rows="3">'+esc(cur.replace(/<[^>]+>/g,''))+'</textarea>' +
    '<div style="display:flex;gap:6px;margin-top:7px;">' +
    '<button onclick="doSaveEdit(\''+id+'\')" style="flex:1;padding:8px;background:var(--coral);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;">저장</button>' +
    '<button onclick="render()" style="flex:1;padding:8px;background:var(--bg2);border:none;border-radius:8px;font-size:12px;cursor:pointer;">취소</button>' +
    '</div>';
  var ta = document.getElementById('plzedit-'+id);
  if (ta) { ta.style.height = ta.scrollHeight+'px'; ta.focus(); }
}
function doSaveEdit(id) {
  var ta = document.getElementById('plzedit-'+id); if (!ta) return;
  var val = ta.value.trim(); if (!val) { alert('내용을 입력해주세요.'); return; }
  var r = findPost(id); if (!r.post) return;
  r.post.title = val; savePlzData(r.data); render();
}
function doDel(id) {
  if (!confirm('이 딜 요청을 삭제할까요?')) return;
  var r = findPost(id); if (!r.post || !isMyPost(r.post)) return;
  r.data.posts = r.data.posts.filter(function(p){return p.id!==id;});
  savePlzData(r.data); render();
}

render();
</script>
</body>
</html>
