<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>딜 광장 | 모딜</title>
<link rel="stylesheet" href="mobile.css">
<style>
* { box-sizing: border-box; }
body { background: var(--bg); min-height: 100vh; padding-bottom: 90px; }

/* 헤더 */
.plz-header {
  background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
  padding: 16px 16px 14px; display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 100;
}
.plz-back {
  background: rgba(255,255,255,0.22); border: none; border-radius: 50%;
  width: 36px; height: 36px; font-size: 18px; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.plz-title { font-size: 17px; font-weight: 900; color: #fff; }
.plz-subtitle { font-size: 11.5px; color: rgba(255,255,255,0.8); margin-top: 2px; }

/* 정렬 탭 */
.plz-tabs { display: flex; gap: 8px; padding: 12px 14px 0; }
.plz-tab {
  padding: 7px 16px; border-radius: 100px; border: 1.5px solid var(--coral-soft);
  background: var(--paper); font-size: 12px; font-weight: 700; color: var(--coral-dark); cursor: pointer;
}
.plz-tab.active { background: var(--coral); color: #fff; border-color: var(--coral); }

/* ========== 롤링 피드 ========== */
.roll-wrap {
  overflow: hidden;
  padding: 10px 0 0;
  position: relative;
}
.roll-track {
  display: flex;
  flex-direction: column;
  gap: 0;
  animation: rollUp 30s linear infinite;
}
.roll-track:hover { animation-play-state: paused; }
@keyframes rollUp {
  0%   { transform: translateY(0); }
  100% { transform: translateY(-50%); }
}

/* 카드 디자인 */
.plz-card {
  background: var(--paper);
  border-radius: 16px;
  margin: 0 14px 10px;
  padding: 14px 14px 12px;
  box-shadow: 0 2px 10px rgba(45,20,16,0.07);
  border: 1.5px solid var(--line);
  transition: box-shadow 0.18s;
}
.plz-card.pinned { border-color: var(--coral-soft); background: #fff8f6; }
.plz-card-head {
  display: flex; align-items: center; gap: 9px; margin-bottom: 8px;
}
.plz-ava {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--coral-bg); display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.plz-nick { font-size: 13px; font-weight: 800; color: var(--ink); }
.plz-lvl { font-size: 10px; color: var(--ink3); margin-left: 5px; font-weight: 600; }
.plz-pin-badge {
  margin-left: auto; font-size: 10px; font-weight: 800;
  color: var(--coral-dark); background: var(--coral-bg);
  padding: 3px 8px; border-radius: 100px;
}
.plz-time { margin-left: auto; font-size: 10.5px; color: var(--ink3); }
.plz-cat {
  display: inline-block; font-size: 10.5px; font-weight: 800;
  color: var(--coral-dark); background: var(--coral-bg);
  padding: 3px 9px; border-radius: 100px; margin-bottom: 6px;
}
.plz-body-txt {
  font-size: 14px; font-weight: 700; color: var(--ink);
  line-height: 1.45; margin-bottom: 10px;
}
.plz-body-txt b { color: var(--coral-dark); font-weight: 900; }
.plz-foot {
  display: flex; gap: 6px; align-items: center;
  padding-top: 8px; border-top: 1px solid var(--line);
}
.plz-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 11px; border-radius: 100px; border: 1.5px solid var(--line2);
  background: var(--bg); font-size: 11.5px; font-weight: 700; color: var(--ink2); cursor: pointer;
}
.plz-btn.on { background: var(--coral-bg); border-color: var(--coral-soft); color: var(--coral-dark); }
.plz-btn.share { margin-left: auto; background: transparent; border-color: transparent; color: var(--coral-dark); }
.plz-mine { font-size: 10px; background: var(--coral); color: #fff; padding: 2px 7px; border-radius: 100px; margin-left: 4px; }

/* 빈 상태 */
.plz-empty { text-align: center; padding: 60px 20px; color: var(--ink2); font-size: 14px; }

/* 딜 요청하기 버튼 */
.plz-post-btn {
  position: fixed; bottom: 20px; right: 18px; z-index: 200;
  background: var(--coral); color: #fff; border: none; border-radius: 50px;
  padding: 13px 22px; font-size: 14px; font-weight: 800; cursor: pointer;
  box-shadow: 0 4px 16px rgba(255,99,71,0.38);
}
</style>
</head>
<body>

<div class="plz-header">
  <button class="plz-back" onclick="history.back()">←</button>
  <div style="flex:1">
    <div class="plz-title">🔥 실시간 딜 광장</div>
    <div class="plz-subtitle" id="plzCount"></div>
  </div>
</div>

<div class="plz-tabs">
  <button class="plz-tab active" id="sortLikes" onclick="setSort('likes')">👍 인기순</button>
  <button class="plz-tab" id="sortNew" onclick="setSort('new')">🆕 최신순</button>
</div>

<!-- 롤링 피드 -->
<div class="roll-wrap" id="rollWrap">
  <div class="roll-track" id="rollTrack"></div>
</div>

<button class="plz-post-btn" onclick="goPost()">✍️ 딜 요청하기</button>

<script src="data.js"></script>
<script>
var PLZ_KEY = 'modilMobilePlaza_v1';
var USER_KEY = 'modilUser_v1';
var sortMode = 'likes';

function loadPlzData() {
  try {
    var s = localStorage.getItem(PLZ_KEY);
    if (s) {
      var d = JSON.parse(s);
      var cutoff = Date.now() - 30 * 86400000;
      d.posts = (d.posts || []).filter(function(p) { return !p.ts || p.ts > cutoff; });
      localStorage.setItem(PLZ_KEY, JSON.stringify(d));
      return d;
    }
  } catch(e) {}
  return { posts: [] };
}
function savePlzData(data) { try { localStorage.setItem(PLZ_KEY, JSON.stringify(data)); } catch(e) {} }
function currentUser() { try { var s = localStorage.getItem(USER_KEY); return s ? JSON.parse(s) : null; } catch(e) { return null; } }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function num(n) { return Number(n||0).toLocaleString(); }
function agoText(m) { if(!m||m<1) return '방금 전'; if(m<60) return m+'분 전'; if(m<1440) return Math.floor(m/60)+'시간 전'; return Math.floor(m/1440)+'일 전'; }
function isMyPost(p) { var u = currentUser(); return u && u.name === p.nick; }

function safeTitle(t) {
  return String(t||'').replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>');
}

function cardHTML(p) {
  var mine = isMyPost(p);
  var title = safeTitle(p.title);
  return '<div class="plz-card' + (p.pinned?' pinned':'') + '" id="plzfc-'+p.id+'">' +
    '<div class="plz-card-head">' +
      '<div class="plz-ava">' + (p.ava||'🙂') + '</div>' +
      '<div>' +
        '<span class="plz-nick">' + esc(p.nick) + '</span>' +
        '<span class="plz-lvl">' + esc(p.lvl||'LV.1') + '</span>' +
        (mine ? '<span class="plz-mine">내 글</span>' : '') +
      '</div>' +
      (p.pinned ? '<span class="plz-pin-badge">📌 고정</span>' : '<span class="plz-time">' + agoText(p.ago||0) + '</span>') +
    '</div>' +
    '<div class="plz-cat">#' + esc(p.cat) + '</div>' +
    '<div class="plz-body-txt" id="plzfct-'+p.id+'">' + title + '</div>' +
    '<div class="plz-foot">' +
      '<button class="plz-btn'+(p.liked?' on':'')+'" onclick="doLike(\''+p.id+'\')">👍 '+num(p.likes)+'</button>' +
      '<button class="plz-btn'+(p.lolled?' on':'')+'" onclick="doLol(\''+p.id+'\')">😂 '+num(p.lols||0)+'</button>' +
      '<button class="plz-btn share" onclick="doShare(\''+p.id+'\',\''+esc(p.title)+'\')">📤 추천</button>' +
      (mine ? '<button class="plz-btn" onclick="doEdit(\''+p.id+'\')">✏️</button><button class="plz-btn" onclick="doDel(\''+p.id+'\')">🗑️</button>' : '') +
    '</div>' +
  '</div>';
}

var rollTimer = null;

function render() {
  var data = loadPlzData();
  var posts = data.posts.slice();
  if (sortMode === 'likes') {
    posts.sort(function(a,b) { return (b.pinned?10000:0)+(b.likes||0) - ((a.pinned?10000:0)+(a.likes||0)); });
  } else {
    posts.sort(function(a,b) { return (b.ts||0)-(a.ts||0); });
  }

  var cnt = document.getElementById('plzCount');
  if (cnt) cnt.textContent = '총 ' + posts.length + '개의 딜 요청';

  var track = document.getElementById('rollTrack');
  var wrap = document.getElementById('rollWrap');

  if (!posts.length) {
    track.innerHTML = '<div class="plz-empty">아직 딜 요청이 없어요.<br>첫 딜을 요청해보세요! 🐴</div>';
    wrap.style.animation = 'none';
    return;
  }

  var cardsHTML = posts.map(cardHTML).join('');
  // 롤링을 위해 두 번 복제 (seamless loop)
  track.innerHTML = cardsHTML + cardsHTML;

  // 애니메이션 속도: 카드 수 × 3.5초
  var dur = Math.max(20, posts.length * 3.5);
  track.style.animationDuration = dur + 's';
  track.style.animationPlayState = 'running';
}

function setSort(mode) {
  sortMode = mode;
  document.getElementById('sortLikes').classList.toggle('active', mode==='likes');
  document.getElementById('sortNew').classList.toggle('active', mode==='new');
  render();
}

function findPost(id) { var d = loadPlzData(); return { data: d, post: d.posts.find(function(p){return p.id===id;}) }; }

function doLike(id) {
  var r = findPost(id); if (!r.post) return;
  r.post.liked = !r.post.liked; r.post.likes = (r.post.likes||0)+(r.post.liked?1:-1);
  savePlzData(r.data); render();
}
function doLol(id) {
  var r = findPost(id); if (!r.post) return;
  r.post.lolled = !r.post.lolled; r.post.lols = (r.post.lols||0)+(r.post.lolled?1:-1);
  savePlzData(r.data); render();
}
function doShare(id, title) {
  var url = 'https://visualmakerofficial-sejung.github.io/homme/#post-' + id;
  if (navigator.share) { navigator.share({ title: '모딜 딜 공유', text: title, url: url }); }
  else { navigator.clipboard.writeText(url).then(function(){ alert('링크 복사됨!'); }); }
}
function doEdit(id) {
  var r = findPost(id); if (!r.post || !isMyPost(r.post)) return;
  var els = document.querySelectorAll('#plzfct-' + id);
  if (!els.length) return;
  var el = els[0];
  var cur = r.post.title;
  el.innerHTML = '<textarea id="plzedit-'+id+'" style="width:100%;border:1.5px solid var(--coral);border-radius:8px;padding:8px;font-size:13px;resize:none;" rows="3">'+esc(cur)+'</textarea>' +
    '<div style="display:flex;gap:6px;margin-top:6px;">' +
    '<button onclick="doSaveEdit(\''+id+'\')" style="flex:1;padding:7px;background:var(--coral);color:#fff;border:none;border-radius:8px;font-size:12px;cursor:pointer;">저장</button>' +
    '<button onclick="render()" style="flex:1;padding:7px;background:var(--bg2);border:none;border-radius:8px;font-size:12px;cursor:pointer;">취소</button>' +
    '</div>';
  // 편집 중 롤링 멈춤
  document.getElementById('rollTrack').style.animationPlayState = 'paused';
}
function doSaveEdit(id) {
  var ta = document.getElementById('plzedit-'+id); if (!ta) return;
  var val = ta.value.trim(); if (!val) { alert('내용을 입력해주세요.'); return; }
  var r = findPost(id); if (!r.post) return;
  r.post.title = val; savePlzData(r.data); render();
}
function doDel(id) {
  if (!confirm('이 딜 요청을 삭제할까요?')) return;
  var r = findPost(id); if (!r.post || !isMyPost(r.post)) return;
  r.data.posts = r.data.posts.filter(function(p){return p.id!==id;});
  savePlzData(r.data); render();
}
function goPost() { location.href = 'index.html'; }

render();
</script>
</body>
</html>
