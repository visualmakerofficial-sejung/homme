# Render 원클릭 배포 설정 (https://render.com)
# 1) Render 로그인 → New → Blueprint → 이 저장소 연결
# 2) 배포 후 Environment 에서 GEMINI_API_KEY 값만 입력하면 실사 생성 동작
services:
  - type: web
    name: grok-studio
    runtime: node
    plan: free
    branch: claude/ai-product-showcase-tool-yobhdq
    buildCommand: ""
    startCommand: node server.js
    envVars:
      # 사진(실사 착장) — 필수. https://aistudio.google.com/apikey 에서 발급
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      # 영상 — 클링(fal.ai 게이트웨이). FAL_KEY 는 Render Environment 에 직접 입력
      - key: VIDEO_PROVIDER
        value: kling
      - key: FAL_KEY
        sync: false
      - key: FAL_KLING_MODEL
        value: fal-ai/kling-video/v1.6/pro/image-to-video
